name: 🚀 Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main  # Deploy whenever main branch gets a push

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, pank04]

    steps:
      - name: 🧹 Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test || echo "No tests defined."

      - name: 🏗️ Build app (optional for frontend)
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm ci
            npm run build
          fi
      - name: 🚀 Deploy to production server
        
