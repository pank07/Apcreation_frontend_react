name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Trigger when code is pushed to 'main'
  workflow_dispatch:  # Allows manual run using 'gh workflow run'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 🧩 Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # ⚙️ Step 2: Set up Docker Buildx
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # 🧱 Step 3: Log in to AWS ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      # 🐳 Step 4: Build, tag, and push image to ECR
      - name: Build, tag, and push image to ECR
        env:
          AWS_REGION: ap-south-1
          ECR_REGISTRY: 484916371129.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: my-app-repo
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 🔐 Step 5: Deploy to EC2 via SSH
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u AWS -p $(aws ecr get-login-password --region ap-south-1) 484916371129.dkr.ecr.ap-south-1.amazonaws.com
            docker pull 484916371129.dkr.ecr.ap-south-1.amazonaws.com/my-app-repo:latest
            docker stop my-app || true
            docker rm my-app || true
            docker run -d -p 80:80 --name my-app 484916371129.dkr.ecr.ap-south-1.amazonaws.com/my-app-repo:latest
