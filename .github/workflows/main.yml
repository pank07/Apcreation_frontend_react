name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Trigger this pipeline when code is pushed to 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 🧩 Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v2

      # ⚙️ Step 2: Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # 🧱 Step 3: Log in to AWS ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 🐳 Step 4: Build and push Docker image
      - name: Build, tag, and push image to ECR
        env:
          ECR_REPOSITORY: my-app-repo
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

      # 🔐 Step 5: Deploy to EC2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ steps.login-ecr.outputs.registry }}/my-app-repo:latest
            docker stop my-app || true
            docker rm my-app || true
            docker run -d -p 80:80 --name my-app ${{ steps.login-ecr.outputs.registry }}/my-app-repo:latest
